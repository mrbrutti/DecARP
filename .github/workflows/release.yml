name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build universal binary & publish
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust with both macOS targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build universal binary
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/decarp \
            target/aarch64-apple-darwin/release/decarp \
            target/x86_64-apple-darwin/release/decarp
          lipo -info dist/decarp

      - name: Package tarball
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cp README.md LICENSE dist/
          ASSET="decarp-${TAG}-macos-universal.tar.gz"
          tar -C dist -czf "$ASSET" decarp README.md LICENSE
          shasum -a 256 "$ASSET" > "$ASSET.sha256"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          generate_release_notes: true
